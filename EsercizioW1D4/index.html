<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Amazon</title>
</head>

<body>

    <header>
        <div class="logo">
            <img src="./assets/logo.png" alt="Amazon Logo">
        </div>
        <nav>
            <ul class="menu">
                <li><a href="#">All</a></li>
                <li><a href="#">Today's deals</a></li>
                <li><a href="#">Customer Service</a></li>
                <li><a href="#">Registry</a></li>
                <li><a href="#">Gift Cards</a></li>
                <li><a href="#">Sell</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <p class="bannerTitle">Shop All Holiday Gift Cards</p>

        <div class="giftCard">
            <h1>Holiday Gift Guides</h1>
            <p>Be a go-gifter</p>
        </div>

        <div class="galleryItems">
            <div class="galleryText">
                <h2>Find the perfect gift</h2>
                <a href="#" class="shopNow">Shop now</a>
            </div>
           <div class="imgItems"> 
            <img src="./assets/img_1.jpg" alt="image kindle product" />
            <img src="./assets/img_2.jpg" alt="image kindle product" />
            <img src="./assets/img_3.jpg" alt="image kindle product" />
            <img src="./assets/img_4.jpg" alt="image kindle product" />
            </div>
        </div>

    </main>
    <footer></footer>
</body>

</html>
